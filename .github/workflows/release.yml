name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run dist:linux
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hand-written notes live in .github/release-notes/<tag>.md; without one, generate them from the commits.
          NOTES=(--generate-notes)
          if [ -f ".github/release-notes/$GITHUB_REF_NAME.md" ]; then NOTES=(--notes-file ".github/release-notes/$GITHUB_REF_NAME.md"); fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" "${NOTES[@]}" --title "Forklin ${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" dist/*.AppImage --clobber
